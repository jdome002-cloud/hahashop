# HAHA SHOP — Render Blueprint
# Free plan has no persistent disk: SQLite + uploads reset on every deploy/restart.
# For durable data, upgrade to a paid plan and uncomment the disk block below,
# then set DATA_DIR and UPLOAD_DIR to paths under the mount.

services:
  - type: web
    name: hahashop
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUEMONEY_MOBILE
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Public URL (needed for Discord sign-in and password-reset links)
      - key: PUBLIC_URL
        value: https://hahashop.onrender.com
      # Discord OAuth2 (redirect URI: https://hahashop.onrender.com/auth/discord/callback)
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      # SMTP for forgot-password emails (leave empty to disable; admin can reset passwords instead)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      # --- Paid starter (or higher): uncomment disk + path env vars ---
      # - key: DATA_DIR
      #   value: /var/data
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads

